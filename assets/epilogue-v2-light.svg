.gy{transform-box:fill-box;transform-origin:center top;animation:growY var(--t,1.6s) cubic-bezier(.65,0,.35,1) var(--d,0s) both}
.pp{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
